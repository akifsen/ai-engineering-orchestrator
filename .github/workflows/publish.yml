# Publish only from an explicit version tag on a GitHub-hosted runner.
# Authentication is npm Trusted Publishing (OIDC). Do not use a long-lived npm token.
#
# FIRST RELEASE ONLY:
# 1. Publish the first package version manually with interactive npm 2FA.
#    Do not request CI provenance for that manual publish. It has none.
# 2. Configure the npm Trusted Publisher for this workflow:
#    Organization or user: akifsen
#    Repository: ai-engineering-orchestrator
#    Workflow filename: publish.yml
#    Environment name: leave empty
#    Allowed action: npm publish
# 3. Push the matching release tag.
# 4. This workflow verifies that the already-published artifact is byte-identical
#    and exits successfully without publishing again.
#
# FUTURE RELEASES:
# 1. Push vX.Y.Z.
# 2. GitHub Actions validates everything.
# 3. Trusted Publishing publishes the new version automatically.
#    npm generates provenance for a public package from this public repository.
#
# Trusted publishing needs npm CLI >= 11.5.1 and Node.js >= 22.14.0.
# An existing version succeeds only when dist.integrity and dist.shasum both match
# the tarball packed from this tag. Different bytes under the same version fail.

name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Require the trusted-publishing Node baseline
        run: |
          node --input-type=module <<'EOF'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
              console.error(`Node.js ${process.versions.node} is older than 22.14.0.`);
              process.exit(1);
          }
          EOF

      - name: Install an npm release that supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install root dependencies
        run: npm ci

      - name: Run credential-free tests and package checks
        run: npm test

      - name: Require the tag to match every canonical version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs

      - name: Pack the release artifact once
        env:
          PACK_DESTINATION: ${{ runner.temp }}/aeo-npm-pack
        run: node scripts/pack-release-artifact.mjs

      - name: Publish the packed artifact or accept an identical registry copy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACK_DESTINATION: ${{ runner.temp }}/aeo-npm-pack
        run: node scripts/publish-packed-release.mjs
